<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Salon Management · Argo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<style>
  :root{
    --primary:#2563EB;        /* blue-600 */
    --primary-dark:#1D4ED8;
    --sidebar:#0F172A;        /* slate-900 */
    --active:#1E293B;         /* slate-800 */
    --canvas:#F3F4F6;         /* gray-100 */
    --success:#059669;        /* emerald-600 */
    --danger:#E11D48;         /* rose-600 */
    --warning:#D97706;        /* amber-600 */
    --ink:#111827;            /* gray-900 */
    --g50:#F9FAFB; --g100:#F3F4F6; --g200:#E5E7EB; --g300:#D1D5DB;
    --g400:#9CA3AF; --g500:#6B7280; --g700:#374151; --g900:#111827;
    --shadow-sm:0 1px 2px rgba(15,23,42,.06), 0 1px 1px rgba(15,23,42,.04);
    --shadow-md:0 4px 10px rgba(15,23,42,.10), 0 2px 4px rgba(15,23,42,.06);
    --shadow-2xl:0 24px 48px rgba(15,23,42,.28), 0 8px 16px rgba(15,23,42,.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--canvas);color:var(--ink);
    font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}

  /* ---------- Shell ---------- */
  .shell{display:flex; min-height:100vh;}
  .sidebar{
    width:240px; flex:0 0 240px; background:var(--sidebar); color:#fff;
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  }
  .sidebar-brand{display:flex; align-items:center; gap:10px; padding:18px 16px; }
  .sidebar-brand .mark{width:32px;height:32px;border-radius:8px;background:var(--primary);
    display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto;}
  .sidebar-brand .name{font-weight:600; font-size:15px;}
  .sidebar-nav{flex:1; overflow-y:auto; padding:6px 10px;}
  .nav-section{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:#64748B; padding:16px 10px 6px;}
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px;
    color:#CBD5E1; text-decoration:none; font-size:14px; font-weight:500; margin-bottom:2px;
    border:none; background:transparent; width:100%; text-align:left;
  }
  .nav-item i{font-size:15px; width:18px; text-align:center; flex:0 0 auto;}
  .nav-item .badge-count{margin-left:auto; background:#334155; color:#E2E8F0; font-size:11px;
    font-weight:600; padding:1px 7px; border-radius:999px;}
  .nav-item:hover{background:#152238; color:#fff;}
  .nav-item.active{background:var(--active); color:#fff;}
  .nav-item.active .badge-count{background:var(--primary);}
  .sidebar-foot{padding:12px 16px; font-size:11px; color:#475569; border-top:1px solid #1E293B;}

  .main{flex:1; display:flex; flex-direction:column; min-width:0;}
  .topbar{
    height:64px; flex:0 0 64px; background:var(--sidebar); position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between; padding:0 20px;
  }
  .org-pill{display:flex; align-items:center; gap:8px; background:#1E293B; color:#E2E8F0;
    padding:6px 12px 6px 8px; border-radius:999px; font-size:13px; font-weight:500;}
  .org-pill .dot{width:22px;height:22px;border-radius:50%;background:#6D28D9;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;}
  .topbar-right{display:flex; align-items:center; gap:16px;}
  .bell{color:#94A3B8; font-size:17px; position:relative;}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;}

  .content{padding:24px 28px 60px; max-width:1280px; width:100%; margin:0 auto;}

  /* ---------- Page header ---------- */
  .page-header{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:20px; gap:16px; flex-wrap:wrap;}
  .page-title{font-size:20px; font-weight:600; margin:0;}
  .page-sub{font-size:14px; color:var(--g500); margin:4px 0 0;}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 14px;
    border-radius:6px; font-size:14px; font-weight:500; border:1px solid transparent; white-space:nowrap;}
  .btn-primary{background:var(--primary); color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-secondary{background:var(--g100); color:var(--g900); border-color:var(--g200);}
  .btn-secondary:hover{background:var(--g200);}
  .btn-outline{background:#fff; color:var(--g700); border-color:var(--g300);}
  .btn-outline:hover{background:var(--g50);}
  .btn-ghost{background:transparent; color:var(--g500); border-color:transparent;}
  .btn-ghost:hover{background:var(--g100);}
  .btn-delete{background:var(--danger); color:#fff;}
  .btn-delete:hover{background:#BE123C;}
  .btn-sm{height:30px; padding:0 10px; font-size:13px;}

  /* ---------- Tabs (sub-navigation) ---------- */
  .tabs{display:flex; gap:2px; background:#fff; border:1px solid var(--g200); border-radius:10px;
    padding:4px; width:max-content; margin-bottom:18px; overflow-x:auto;}
  .tab{border:none; background:transparent; padding:7px 14px; border-radius:6px; font-size:13.5px;
    font-weight:500; color:var(--g500); white-space:nowrap;}
  .tab.active{background:var(--g100); color:var(--g900);}

  /* ---------- KPI cards ---------- */
  .kpi-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px;}
  .kpi-card{background:#fff; border:1px solid var(--g200); border-radius:12px; padding:16px 18px;
    display:flex; align-items:center; gap:12px; box-shadow:var(--shadow-sm); transition:box-shadow .15s;}
  .kpi-card:hover{box-shadow:var(--shadow-md);}
  .kpi-icon{width:40px;height:40px;border-radius:10px; display:flex;align-items:center;justify-content:center; flex:0 0 auto; font-size:17px;}
  .kpi-value{font-size:22px; font-weight:600; line-height:1.15;}
  .kpi-label{font-size:12.5px; color:var(--g500); font-weight:500; margin-top:1px;}
  .kpi-delta{font-size:11px; font-weight:600; color:var(--success); margin-left:4px;}

  /* ---------- Card / panel ---------- */
  .panel{background:#fff; border:1px solid var(--g200); border-radius:16px; box-shadow:var(--shadow-sm); overflow:hidden;}
  .panel-header{padding:18px 20px 4px;}
  .panel-title{font-size:15px; font-weight:600; margin:0;}

  /* ---------- Filter bar ---------- */
  .filter-bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:16px 20px;}
  .search-wrap{position:relative; flex:1; min-width:200px; max-width:340px;}
  .search-wrap i{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--g400); font-size:13px;}
  .search-input{width:100%; height:36px; border:1px solid var(--g300); border-radius:8px;
    padding:0 12px 0 32px; font-size:13.5px; outline:none;}
  .search-input:focus{border-color:var(--primary); box-shadow:0 0 0 3px rgba(37,99,235,.15);}
  select.filter-select{height:36px; border:1px solid var(--g300); border-radius:8px; padding:0 10px;
    font-size:13.5px; background:#fff; color:var(--g700); outline:none;}
  select.filter-select:focus{border-color:var(--primary);}
  .filter-spacer{flex:1;}

  /* ---------- Table ---------- */
  .table-scroll{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{text-align:left; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    color:var(--g500); padding:10px 20px; border-top:1px solid var(--g200); border-bottom:1px solid var(--g200); background:var(--g50);}
  tbody td{padding:14px 20px; border-bottom:1px solid var(--g100); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--g50);}
  .cell-primary{font-weight:600; color:var(--g900);}
  .cell-muted{color:var(--g500);}

  /* ---------- Badges ---------- */
  .badge{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600;
    padding:3px 10px 3px 8px; border-radius:999px; border:1px solid transparent;}
  .badge .bdot{width:6px;height:6px;border-radius:50%;}
  .badge-blue{background:#EFF6FF; border-color:#BFDBFE; color:#1D4ED8;} .badge-blue .bdot{background:#2563EB;}
  .badge-emerald{background:#ECFDF5; border-color:#A7F3D0; color:#047857;} .badge-emerald .bdot{background:#059669;}
  .badge-amber{background:#FFFBEB; border-color:#FDE68A; color:#B45309;} .badge-amber .bdot{background:#D97706;}
  .badge-rose{background:#FFF1F2; border-color:#FECDD3; color:#BE123C;} .badge-rose .bdot{background:#E11D48;}
  .badge-gray{background:#F9FAFB; border-color:#E5E7EB; color:#374151;} .badge-gray .bdot{background:#6B7280;}

  /* ---------- Row actions ---------- */
  .actions-cell{text-align:right;}
  .kebab-wrap{position:relative; display:inline-block;}
  .kebab-btn{width:28px;height:28px; border-radius:6px; border:none; background:transparent; color:var(--g500);
    display:inline-flex; align-items:center; justify-content:center; font-size:16px;}
  .kebab-btn:hover{background:var(--g100); color:var(--g900);}
  .kebab-menu{position:absolute; right:0; top:32px; background:#fff; border:1px solid var(--g200);
    border-radius:8px; box-shadow:var(--shadow-md); min-width:170px; z-index:30; display:none; overflow:hidden;}
  .kebab-menu.open{display:block;}
  .kebab-menu button{display:flex; align-items:center; gap:8px; width:100%; text-align:left; border:none;
    background:transparent; padding:9px 12px; font-size:13.5px; color:var(--g700);}
  .kebab-menu button:hover{background:var(--g50);}
  .kebab-menu button.danger{color:var(--danger);}
  .kebab-menu hr{border:none; border-top:1px solid var(--g100); margin:4px 0;}

  /* ---------- Pagination ---------- */
  .pager{display:flex; align-items:center; justify-content:space-between; padding:14px 20px;
    border-top:1px solid var(--g200); font-size:13px; color:var(--g500); flex-wrap:wrap; gap:10px;}
  .pager-left{display:flex; align-items:center; gap:8px;}
  .pager-left select{height:30px; border:1px solid var(--g300); border-radius:6px; padding:0 6px; font-size:13px;}
  .pager-btns{display:flex; align-items:center; gap:4px;}
  .pager-btns button{min-width:30px; height:30px; border-radius:6px; border:1px solid var(--g200);
    background:#fff; color:var(--g700); font-size:13px;}
  .pager-btns button.active{background:var(--primary); border-color:var(--primary); color:#fff; font-weight:600;}
  .pager-btns button:disabled{opacity:.4; cursor:not-allowed;}

  /* ---------- Empty state ---------- */
  .empty-state{padding:64px 20px; text-align:center;}
  .empty-state .icon{width:56px;height:56px;border-radius:16px;background:var(--g100); color:var(--g400);
    display:flex;align-items:center;justify-content:center; margin:0 auto 14px; font-size:22px;}
  .empty-state h4{margin:0 0 4px; font-size:14.5px; font-weight:600;}
  .empty-state p{margin:0; font-size:13.5px; color:var(--g500);}

  /* ---------- Modal ---------- */
  .modal-backdrop{position:fixed; inset:0; background:rgba(15,23,42,.45); display:none;
    align-items:center; justify-content:center; z-index:100; padding:20px;}
  .modal-backdrop.open{display:flex;}
  .modal{background:#fff; border-radius:16px; box-shadow:var(--shadow-2xl); width:100%; max-width:460px;
    max-height:88vh; display:flex; flex-direction:column;}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px;
    border-bottom:1px solid var(--g100); cursor:move;}
  .modal-head h3{margin:0; font-size:15px; font-weight:600;}
  .modal-head button{border:none; background:transparent; font-size:18px; color:var(--g400); width:28px; height:28px; border-radius:6px;}
  .modal-head button:hover{background:var(--g100); color:var(--g700);}
  .modal-body{padding:18px 20px; overflow-y:auto; display:flex; flex-direction:column; gap:14px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--g700); margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%; border:1px solid var(--g300); border-radius:8px;
    padding:8px 11px; font-size:13.5px; outline:none;}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--primary); box-shadow:0 0 0 3px rgba(37,99,235,.15);}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .modal-foot{display:flex; justify-content:flex-end; gap:8px; padding:14px 20px; border-top:1px solid var(--g100);}

  /* ---------- Mobile cards (list-as-cards) ---------- */
  .mobile-list{display:none; padding:8px 12px 12px;}
  .mcard{background:#fff; border:1px solid var(--g200); border-radius:12px; padding:14px; margin-bottom:10px;}
  .mcard-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .mcard-title{font-weight:600; font-size:14px;}
  .mcard-sub{font-size:12.5px; color:var(--g500);}
  .mcard-row{display:flex; justify-content:space-between; font-size:12.5px; color:var(--g500); margin-top:4px;}

  @media (max-width:860px){
    .kpi-row{grid-template-columns:repeat(2,1fr);}
    .table-scroll{display:none;}
    .mobile-list{display:block;}
  }
  @media (max-width:640px){
    .sidebar{position:fixed; left:-240px; transition:left .2s; z-index:50;}
    .sidebar.open{left:0;}
    .kpi-row{grid-template-columns:1fr 1fr;}
    .content{padding:16px;}
  }

  .hint{font-size:11px; color:var(--g400); margin-top:2px;}
  .devbar{background:#fff; border-bottom:1px solid var(--g200); padding:8px 16px; font-size:12px;
    color:var(--g500); display:flex; gap:14px; align-items:center; flex-wrap:wrap;}
  .devbar button{border:1px solid var(--g300); background:#fff; border-radius:6px; padding:4px 9px; font-size:12px; color:var(--g700);}
  .devbar button:hover{background:var(--g50);}
</style>
</head>
<body>

<div class="shell">
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="mark"><i class="bi bi-scissors"></i></div>
      <div class="name">Salon Management</div>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-page="dashboard"><i class="bi bi-grid-1x2"></i>Dashboard</button>
      <button class="nav-item" data-page="appointments"><i class="bi bi-calendar-check"></i>Appointments<span class="badge-count" id="apptCount">7</span></button>
      <button class="nav-item" data-page="clients"><i class="bi bi-people"></i>Clients</button>
      <button class="nav-item" data-page="staff"><i class="bi bi-person-badge"></i>Staff</button>
      <button class="nav-item" data-page="services"><i class="bi bi-stars"></i>Services</button>
      <div class="nav-section">Reports</div>
      <button class="nav-item" data-page="reports"><i class="bi bi-bar-chart-line"></i>Reports</button>
    </nav>
    <div class="sidebar-foot">Salon Module · v1.0 (ARGO)</div>
  </aside>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <div class="topbar">
      <div class="org-pill"><span class="dot">B</span> Bella Salon &amp; Spa</div>
      <div class="topbar-right">
        <i class="bi bi-bell bell"></i>
        <div class="avatar">JR</div>
      </div>
    </div>

    <div class="devbar">
      <span><i class="bi bi-eye"></i> Preview:</span>
      <button id="toggleEmpty">Toggle empty state</button>
      <span class="hint">(resize window &lt; 860px to see mobile card view)</span>
    </div>

    <div class="content" id="content"><!-- page renders here --></div>
  </div>
</div>

<!-- ============ MODAL ============ -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal">
    <div class="modal-head">
      <h3 id="modalTitle">New</h3>
      <button onclick="closeModal()"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="modalSave" onclick="saveModal()">Save</button>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   MOCK DATA — stands in for the API contract in API_CONTRACT.md.
   In production these render() functions would be fed by fetch() calls
   to /api/appointments, /api/clients, /api/staff, /api/services with the
   platform JWT attached, exactly as documented in the vertical slice.
===================================================================== */
let showEmpty = false;

const staffList = [
  {id:'s1', name:'Maria Santos', title:'Senior Stylist', status:'active', apptsWeek:14},
  {id:'s2', name:'Juan dela Cruz', title:'Colorist', status:'active', apptsWeek:9},
  {id:'s3', name:'Ana Reyes', title:'Nail Technician', status:'active', apptsWeek:11},
  {id:'s4', name:'Leo Garcia', title:'Barber', status:'inactive', apptsWeek:0},
];

const servicesList = [
  {id:'sv1', name:'Haircut & Style', category:'Hair', duration:30, price:800, status:'active'},
  {id:'sv2', name:'Full Color', category:'Hair', duration:90, price:2500, status:'active'},
  {id:'sv3', name:'Gel Manicure', category:'Nails', duration:45, price:600, status:'active'},
  {id:'sv4', name:'Deep Tissue Massage', category:'Spa', duration:60, price:1500, status:'active'},
  {id:'sv5', name:'Perm (legacy)', category:'Hair', duration:120, price:1800, status:'inactive'},
];

const clientsList = [
  {id:'c1', name:'Sofia Lim', phone:'0917 111 2222', email:'sofia@example.com', lastVisit:'Jul 14, 2026', visits:12},
  {id:'c2', name:'Marco Tan', phone:'0917 333 4444', email:'marco@example.com', lastVisit:'Jul 10, 2026', visits:5},
  {id:'c3', name:'Elena Cruz', phone:'0917 555 6666', email:'elena@example.com', lastVisit:'Jun 30, 2026', visits:22},
  {id:'c4', name:'Ramon Diaz', phone:'0917 777 8888', email:'ramon@example.com', lastVisit:'Jun 22, 2026', visits:2},
];

const appointmentsList = [
  {id:'a1', time:'9:00 AM', date:'Jul 20, 2026', client:'Sofia Lim', staff:'Maria Santos', service:'Haircut & Style', duration:30, status:'confirmed'},
  {id:'a2', time:'9:30 AM', date:'Jul 20, 2026', client:'Marco Tan', staff:'Juan dela Cruz', service:'Full Color', duration:90, status:'in_progress'},
  {id:'a3', time:'10:15 AM', date:'Jul 20, 2026', client:'Elena Cruz', staff:'Ana Reyes', service:'Gel Manicure', duration:45, status:'requested'},
  {id:'a4', time:'11:00 AM', date:'Jul 20, 2026', client:'Ramon Diaz', staff:'Maria Santos', service:'Haircut & Style', duration:30, status:'completed'},
  {id:'a5', time:'1:00 PM', date:'Jul 20, 2026', client:'Sofia Lim', staff:'Ana Reyes', service:'Deep Tissue Massage', duration:60, status:'cancelled'},
  {id:'a6', time:'2:30 PM', date:'Jul 20, 2026', client:'Marco Tan', staff:'Maria Santos', service:'Haircut & Style', duration:30, status:'no_show'},
  {id:'a7', time:'3:15 PM', date:'Jul 19, 2026', client:'Elena Cruz', staff:'Juan dela Cruz', service:'Full Color', duration:90, status:'completed'},
];

const STATUS_META = {
  requested:   {label:'Requested',   cls:'badge-amber'},
  confirmed:   {label:'Confirmed',   cls:'badge-blue'},
  in_progress: {label:'In Progress', cls:'badge-emerald'},
  completed:   {label:'Completed',   cls:'badge-gray'},
  cancelled:   {label:'Cancelled',   cls:'badge-rose'},
  no_show:     {label:'No-Show',     cls:'badge-rose'},
};

function badge(status){
  const m = STATUS_META[status] || {label:status, cls:'badge-gray'};
  return `<span class="badge ${m.cls}"><span class="bdot"></span>${m.label}</span>`;
}
function money(cents){ return '₱' + (cents).toLocaleString(); }
function initials(name){ return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

/* =====================================================================
   SHELL / NAV
===================================================================== */
const pages = {};
let currentPage = 'dashboard';

document.querySelectorAll('.nav-item[data-page]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.nav-item[data-page]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentPage = btn.dataset.page;
    render();
  });
});

document.getElementById('toggleEmpty').addEventListener('click', ()=>{
  showEmpty = !showEmpty;
  render();
});

function render(){
  document.getElementById('content').innerHTML = pages[currentPage]();
  attachKebabHandlers();
}

/* =====================================================================
   PAGINATION HELPER
===================================================================== */
function pagerHtml(total, page, pageSize, idPrefix){
  const pages_ = Math.max(1, Math.ceil(total/pageSize));
  let btns = '';
  for(let i=1;i<=pages_;i++){
    btns += `<button class="${i===page?'active':''}" onclick="goPage('${idPrefix}',${i})">${i}</button>`;
  }
  const start = total===0?0:(page-1)*pageSize+1;
  const end = Math.min(page*pageSize, total);
  return `<div class="pager">
    <div class="pager-left">
      <span>Show</span>
      <select onchange="changePageSize('${idPrefix}', this.value)">
        <option ${pageSize==5?'selected':''}>5</option>
        <option ${pageSize==10?'selected':''}>10</option>
        <option ${pageSize==20?'selected':''}>20</option>
      </select>
      <span>entries · Showing ${start}-${end} of ${total}</span>
    </div>
    <div class="pager-btns">
      <button ${page===1?'disabled':''} onclick="goPage('${idPrefix}',${page-1})">Previous</button>
      ${btns}
      <button ${page===pages_?'disabled':''} onclick="goPage('${idPrefix}',${page+1})">Next</button>
    </div>
  </div>`;
}
const pagerState = {};
function goPage(id, p){ pagerState[id].page = p; render(); }
function changePageSize(id, size){ pagerState[id].page=1; pagerState[id].pageSize = parseInt(size); render(); }
function ensurePagerState(id, defaultSize){
  if(!pagerState[id]) pagerState[id] = {page:1, pageSize:defaultSize};
  return pagerState[id];
}

/* =====================================================================
   KEBAB MENUS
===================================================================== */
function attachKebabHandlers(){
  document.addEventListener('click', function closeAll(e){
    document.querySelectorAll('.kebab-menu.open').forEach(m=>{
      if(!m.parentElement.contains(e.target)) m.classList.remove('open');
    });
  }, {once:true});
}
function toggleKebab(id){
  document.querySelectorAll('.kebab-menu.open').forEach(m=>{ if(m.id!==id) m.classList.remove('open'); });
  document.getElementById(id).classList.toggle('open');
}

    <div class="field"><label>Cancellation reason</label><textarea rows="3" placeholder="Required…"></textarea></div>
  `;
  document.getElementById('modalSave').className = 'btn btn-delete';
  document.getElementById('modalSave').textContent = 'Confirm Cancel';
  setTimeout(()=>{ // reset for next open
    document.getElementById('modalSave').className='btn btn-primary';
    document.getElementById('modalSave').textContent='Save';
  }, 0);
}
function openClientModal(){
  openModal('New Client');
  document.getElementById('modalBody').innerHTML = `
    <div class="field"><label>Full Name</label><input placeholder="e.g. Sofia Lim"/></div>
    <div class="field-row">
      <div class="field"><label>Phone</label><input placeholder="0917 000 0000"/></div>
      <div class="field"><label>Email</label><input placeholder="name@example.com"/></div>
    </div>
    <div class="field"><label>Notes</label><textarea rows="2" placeholder="Allergies, preferences…"></textarea></div>
  `;
}
function openStaffModal(){
  openModal('New Staff Member');
  document.getElementById('modalBody').innerHTML = `
    <div class="field"><label>Platform User</label><select><option>Select existing platform user…</option></select>
      <div class="hint">Staff must already have an ARGO login — this module doesn't create users.</div></div>
    <div class="field"><label>Display Name</label><input placeholder="e.g. Maria Santos"/></div>
    <div class="field"><label>Title</label><input placeholder="e.g. Senior Stylist"/></div>
  `;
}
function openServiceModal(){
  openModal('New Service');
  document.getElementById('modalBody').innerHTML = `
    <div class="field"><label>Name</label><input placeholder="e.g. Haircut & Style"/></div>
    <div class="field-row">
      <div class="field"><label>Category</label><input placeholder="e.g. Hair"/></div>
      <div class="field"><label>Duration (min)</label><input type="number" min="1" value="30"/></div>
    </div>
    <div class="field"><label>Price (₱)</label><input type="number" min="0" value="800"/></div>
  `;
}

/* init */
render();
</script>
</body>
